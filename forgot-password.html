<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kopija GitHub strani za ponastavitev gesla">
    <meta name="author" content="Jakob">
    <title>Forgot your password? · GitHub</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/x-icon" href="style/images/github-white-icon.svg">
</head>

<body>
    <div id="main">
        <div id="header">
            <img src="style/images/github-white-icon.svg" alt="GitHub logo" width="48" height="48">
            <h1 id="signin">Reset your password</h1>
            <p id="reset-text">Enter your user account's verified email address and we will send you a password reset link.</p>
        </div>

        <div id="form">
            <form action="#" method="post">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>

                <button type="submit" class="btn">Send password reset email</button>
            </form>
        </div>

        <div id="create">
            <a href="index.html">Back to sign in</a>
        </div>
    </div>

    <div id="footer">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Docs</a>
        <a href="#">Contact GitHub Support</a>
        <a href="#">Manage cookies</a>
        <a href="#">Do not share my personal information</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="script/forgot-password.js"></script>
</body>

</html>
