<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Opis">
    <meta name="author" content="Jakob">
    <title>Sign in to GitHub</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/x-icon" href="style/images/github-white-icon.svg">
</head>

<body>
    <div id="main">
        <div id="header">
            <img src="style/images/github-white-icon.svg" alt="GitHub logo" width="48" height="48">
            <h1 id="signin">Sign in to GitHub</h1>
        </div>

        <div id="form">
            <form action="prijava" method="post">
                <label for="user">Username or email address</label>
                <input type="text" id="user" name="user" required>

                <div class="row">
                    <label for="pass">Password</label>
                    <a href="#" class="small">Forgot password?</a>
                </div>
                <input type="password" id="pass" name="pass" required>

                <button type="submit" class="btn">Sign in</button>
            </form>
        </div>

        <div class="divider"><span>or</span></div>

        <a href="#" class="social">
            <img src="style/images/google-icon-logo-svgrepo-com.svg" alt="Google logo" width="16" height="16">
            Continue with Google
        </a>

        <a href="#" class="social">
            <img src="style/images/Apple_logo_white.svg" alt="Apple logo" width="16" height="16">
            Continue with Apple
        </a>

        <div id="create">
            New to GitHub? <a href="#">Create an account</a>
        </div>

        <a href="#" id="passkey">Sign in with a passkey</a>
    </div>

    <div id="footer">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Docs</a>
        <a href="#">Contact GitHub Support</a>
        <a href="#">Manage cookies</a>
        <a href="#">Do not share my personal information</a>
    </div>
</body>

</html>
